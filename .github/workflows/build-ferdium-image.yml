name: build-ferdium-image
on:
  push:
    branches: ["1.1"]
    paths: ["images/ferdium/**", ".github/workflows/build-ferdium-image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "ver=$(grep -oP '^ARG FERDIUM_VERSION=\K\S+' images/ferdium/Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/ferdium
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/steemersict/kasm-ferdium:latest
            ghcr.io/steemersict/kasm-ferdium:${{ steps.v.outputs.ver }}
            ghcr.io/steemersict/kasm-ferdium:${{ steps.v.outputs.ver }}-kasm1.19.0
          labels: |
            org.opencontainers.image.source=https://github.com/steemersict/kasm-registry
